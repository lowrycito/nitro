[package]
name = "nitro"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A tiny and efficient Bash agent for the command line (Rust port)"
license = "MIT"
publish = false

[[bin]]
name = "nitro"
path = "src/main.rs"

[lib]
name = "nitro"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "io-util",
    "sync",
    "fs",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
async-stream = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
